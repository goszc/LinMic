name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libopus-dev libgtk-4-dev clang cmake ninja-build pkg-config
      - name: Rust toolchain
        run: rustup show && rustup component add rustfmt clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Native tests
        run: |
          cmake -S tests/native -B target/native-tests
          cmake --build target/native-tests
          ctest --test-dir target/native-tests --output-on-failure
      - run: python3 scripts/check-locales.py
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Native toolchains
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Build, lint and unit tests
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-debug-verification-only
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --deny warnings
      - name: Scan repository history for secrets
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner
