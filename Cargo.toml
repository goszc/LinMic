[workspace]
resolver = "2"
members = ["crates/*", "linux/daemon/linmicd", "linux/cli/linmic", "linux/gui/linmic-gui", "tests/tools"]
default-members = ["linux/daemon/linmicd", "linux/cli/linmic", "tests/tools"]
[workspace.package]
license = "GPL-3.0-or-later"
version = "0.3.0"
edition = "2021"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
[profile.release]
lto = "thin"
strip = true
codegen-units = 1
